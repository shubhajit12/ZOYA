[[permission]]
identifier = "allow-enter-companion"
description = "Allows entering the ZOYA desktop companion mode."
commands.allow = ["enter_companion"]

[[permission]]
identifier = "allow-exit-companion"
description = "Allows exiting the ZOYA desktop companion mode."
commands.allow = ["exit_companion"]

[[permission]]
identifier = "allow-start-mate-companion"
description = "Allows starting the ZOYA Mate companion handoff."
commands.allow = ["start_mate_companion"]

[[permission]]
identifier = "allow-exit-mate-companion"
description = "Allows returning from the Mate companion engine."
commands.allow = ["exit_mate_companion"]

[[permission]]
identifier = "allow-launch-minecraft-bot"
description = "Allows ZOYA to launch the Minecraft bridge bot."
commands.allow = ["launch_minecraft_bot"]

[[permission]]
identifier = "allow-stop-minecraft-bot"
description = "Allows ZOYA to stop the Minecraft bridge bot."
commands.allow = ["stop_minecraft_bot"]

[[permission]]
identifier = "allow-start-companion-drag"
description = "Allows starting desktop companion dragging."
commands.allow = ["start_companion_drag"]

[[permission]]
identifier = "allow-finish-companion-drag"
description = "Allows finishing desktop companion dragging."
commands.allow = ["finish_companion_drag"]

[[permission]]
identifier = "allow-diagnostic-ping"
description = "Allows the ZOYA UI to verify native Tauri command delivery."
commands.allow = ["diagnostic_ping"]

[[permission]]
identifier = "allow-start-window-drag"
description = "Allows the main ZOYA window to be dragged from the custom title bar."
commands.allow = ["start_window_drag"]

[[permission]]
identifier = "allow-minimize-window"
description = "Allows the custom ZOYA title bar to minimize the main window."
commands.allow = ["minimize_window"]

[[permission]]
identifier = "allow-toggle-maximize-window"
description = "Allows the custom ZOYA title bar to maximize or restore the main window."
commands.allow = ["toggle_maximize_window"]

[[permission]]
identifier = "allow-close-window"
description = "Allows the custom ZOYA title bar to close the main window."
commands.allow = ["close_window"]

[[permission]]
identifier = "allow-set-always-on-top"
description = "Allows ZOYA to control the main window always-on-top state."
commands.allow = ["set_always_on_top"]
