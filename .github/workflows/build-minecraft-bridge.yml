name: Build Minecraft Bridge Only

on:
  workflow_dispatch:
  push:
    branches: [minecraft]
    paths:
      - "zoya-ai-companion-MAIN/minecraft-bridge/**"
      - ".github/workflows/build-minecraft-bridge.yml"

jobs:
  build-minecraft-bridge:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: zoya-ai-companion-MAIN

    permissions:
      contents: read

    steps:
      - name: Checkout minecraft branch
        uses: actions/checkout@v4
        with:
          ref: minecraft

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare bridge bundle
        shell: pwsh
        run: |
          $bridgeRoot = Join-Path $PWD 'minecraft-bridge'
          $bridgeDist = Join-Path $env:RUNNER_TEMP 'MinecraftBridge'
          if (Test-Path $bridgeDist) { Remove-Item $bridgeDist -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $bridgeDist | Out-Null
          Copy-Item -Path (Join-Path $bridgeRoot '*.mjs') -Destination $bridgeDist -Force
          Copy-Item -Path (Join-Path $bridgeRoot 'swordPvpModel.json') -Destination $bridgeDist -Force
          Copy-Item -Path (Join-Path $bridgeRoot 'package.json') -Destination (Join-Path $bridgeDist 'package.json') -Force
          Push-Location $bridgeDist
          try { npm install --omit=dev --ignore-scripts } finally { Pop-Location }
          foreach ($dependency in @('mineflayer','mineflayer-pathfinder','mineflayer-tool','mineflayer-collectblock','mineflayer-crafting-util','mineflayer-armor-manager','@nxg-org/mineflayer-tracker','@nxg-org/mineflayer-trajectories')) {
            if (-not (Test-Path (Join-Path $bridgeDist "node_modules/$dependency"))) { throw "Minecraft dependency was not installed: $dependency" }
          }
          foreach ($required in @('index.mjs','zoyaBrain.mjs','minecraftRuntime.mjs','capabilityTester.mjs','capabilityEngine.mjs','capabilityModes.mjs','swordPvpBrain.mjs','swordPvpController.mjs','swordPvpController.test.mjs','pvpDifficulty.mjs','swordPvpModel.json')) {
            if (-not (Test-Path (Join-Path $bridgeDist $required))) { throw "Minecraft bridge runtime file is missing: $required" }
          }

      - name: Validate bridge source and capability guards
        shell: pwsh
        run: |
          $bridgeDist = Join-Path $env:RUNNER_TEMP 'MinecraftBridge'
          Push-Location $bridgeDist
          try {
            foreach ($file in @('index.mjs','zoyaBrain.mjs','minecraftRuntime.mjs','capabilityModes.mjs','capabilityEngine.mjs','capabilityTester.mjs','swordPvpBrain.mjs','swordPvpController.mjs','swordPvpController.test.mjs','pvpDifficulty.mjs','pvpExpertBrain.mjs','pvpExpertController.mjs','pvpExpertBrain.test.mjs')) {
              node --check $file
              if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $file" }
            }
            $indexSource = Get-Content (Join-Path $bridgeDist 'index.mjs') -Raw
            $testerSource = Get-Content (Join-Path $bridgeDist 'capabilityTester.mjs') -Raw
            $engineSource = Get-Content (Join-Path $bridgeDist 'capabilityEngine.mjs') -Raw
            $modesSource = Get-Content (Join-Path $bridgeDist 'capabilityModes.mjs') -Raw
            $runtimeSource = Get-Content (Join-Path $bridgeDist 'minecraftRuntime.mjs') -Raw
            $brainSource = Get-Content (Join-Path $bridgeDist 'zoyaBrain.mjs') -Raw
            $pvpExpertBrainSource = Get-Content (Join-Path $bridgeDist 'pvpExpertBrain.mjs') -Raw
            $pvpExpertControllerSource = Get-Content (Join-Path $bridgeDist 'pvpExpertController.mjs') -Raw
            if ($pvpExpertBrainSource -notmatch 'PVP_EXPERT_BRAIN_VERSION') { throw 'Unified PvP Expert Brain marker is missing.' }
            if ($pvpExpertControllerSource -notmatch 'createPvpExpertBrain') { throw 'Unified PvP Expert Controller is not wired to the expert brain.' }
            if ($pvpExpertControllerSource -match 'setInterval') { throw 'PvP Expert Controller must not create a competing combat loop.' }
            if ($pvpExpertControllerSource -match 'Math\.random') { throw 'PvP Expert Controller must not use random combat decisions.' }
            if ($pvpExpertControllerSource -match '\bplanEV\b|\bsettlePlan\b|\bevBonus\b|optimizer|trainingRuntime|learn:sword|train:sword') { throw 'PvP Expert Controller contains forbidden training/adaptive-learning code.' }
            if ($pvpExpertBrainSource -match '\bplanEV\b|\bsettlePlan\b|\bevBonus\b|optimizer|trainingRuntime|learn:sword|train:sword') { throw 'PvP Expert Brain contains forbidden training/adaptive-learning code.' }
            foreach ($requiredPvpText in @('webEscape','projectileDodge','enemyTotemPopUntil','target_lost','failedActions','sprintReset','bot.placeEntity','new Vec3(0,1,0)')) {
              if ($pvpExpertControllerSource -notmatch [regex]::Escape($requiredPvpText)) { throw "PvP Expert recovery/combat guard is missing: $requiredPvpText" }
            }
            if ($pvpExpertControllerSource -notmatch 'elytraMace') { throw 'Elytra mace executor is missing.' }
            if ($pvpExpertControllerSource -notmatch 'bot\.elytraFly\(\)') { throw 'Mineflayer Elytra flight API is not wired.' }
            if ($pvpExpertControllerSource -notmatch 'crystalCycle') { throw 'Crystal combat executor is missing.' }
            if ($pvpExpertControllerSource -notmatch 'anchorCycle') { throw 'Anchor combat executor is missing.' }
  foreach ($requiredAdvancedControllerText in @('pearlCatch','windChargeCancel','shieldDrain','backstab','maceDTap','stunSlam','elytraMace','fireworkBoost','pearlDestination')) {
    if ($pvpExpertControllerSource -notmatch [regex]::Escape($requiredAdvancedControllerText)) { throw "Advanced PvP executor is missing: $requiredAdvancedControllerText" }
  }
  foreach ($requiredAdvancedBrainText in @('pearl_catch','diagonal_pearl_catch','pearl_grapple','wind_charge_cancel','shield_drain','backstab','mace_d_tap','stun_slam','rocket_mace')) {
    if ($pvpExpertBrainSource -notmatch [regex]::Escape($requiredAdvancedBrainText)) { throw "Advanced PvP brain route is missing: $requiredAdvancedBrainText" }
  }
            $capabilityMarker = [regex]::Match($indexSource, 'manual-capability-v\d+-clean-168-mode-engine-complete-player-actions-\d{4}-\d{2}-\d{2}')
            if (-not $capabilityMarker.Success) { throw 'Capability build marker is missing or invalid.' }
            Write-Host "Capability build marker: $($capabilityMarker.Value)"
            if ($indexSource -notmatch 'createZoyaBrain') { throw 'Groq brain controller is not wired.' }
            if ($indexSource -notmatch 'dispatchCapability') { throw 'Groq capability dispatcher is not wired.' }
            if ($indexSource -notmatch 'ownerUsername') { throw 'Owner identity is not wired into the bridge.' }
            if ($indexSource -notmatch 'askOwnerPermission') { throw 'Owner permission callback is not wired.' }
            if ($indexSource -notmatch 'player_message') { throw 'Player chat is not routed into the Groq brain.' }
            if ($indexSource -notmatch 'CAPABILITY_DEBUG_ENV') { throw 'Manual tester debug switch is missing.' }
            if ($indexSource -notmatch 'playerHalfWidth = 0.30001') { throw '1.21.x collision workaround is missing.' }
            if ($indexSource -notmatch 'playerHeight = 1.80001') { throw '1.21.x collision height workaround is missing.' }
            if ($testerSource -match 'api\.groq\.com') { throw 'Capability tester must never call Groq directly.' }
            $registeredCapabilities = [regex]::Matches($modesSource, '\["[^"]+","[^"]+","[^"]+","[^"]+","[^"]+"\]').Count
            $registeredIds = [regex]::Matches($modesSource, '\["([^"]+)","[^"]+","[^"]+","[^"]+","[^"]+"\]') | ForEach-Object { $_.Groups[1].Value }
            $missingHandlers = @()
            foreach ($id in $registeredIds) {
              if (($engineSource -notmatch ("  " + [regex]::Escape($id) + ": async")) -and ($engineSource -notmatch ("async function " + [regex]::Escape($id) + "\\("))) {
                $missingHandlers += $id
              }
            }
            $logicalHandlerCount = $registeredIds.Count - $missingHandlers.Count
            if ($registeredCapabilities -ne 168) { throw "Expected 168 clean capability definitions, found $registeredCapabilities." }
            if ($logicalHandlerCount -ne 168) { throw "Expected 168 clean capability handlers, found $logicalHandlerCount." }
            if ($missingHandlers.Count -ne 0) { throw "Missing clean capability handlers: $($missingHandlers -join ', ')." }
            if ($modesSource -notmatch 'CAPABILITY_MODES =') { throw 'Canonical capability registry is missing.' }
            if ($engineSource -notmatch 'export async function executeCapability') { throw 'Clean capability executor is missing.' }
            if ($engineSource -match 'ctx\.legacy') { throw 'Clean capability engine must not fall back to legacy handlers.' }
            foreach ($requiredText in @('GoalFollow','GoalNear','GoalPlaceBlock','bot.lookAt','RUNTIME_ACTIONS','HOSTILES','weaponScore','openContainer','deposit','withdraw','bot.craft','bot.dig','bot.placeBlock','combatAim','combatSprintReset','combatStrafe','combatPrepareTotem','combatPearlEscape','combatBowAttack','combatMaceAttack','combatAdvancedAttack','targetBlocking')) {
              if ($engineSource -notmatch [regex]::Escape($requiredText)) { throw "Clean engine guard is missing: $requiredText" }
            }
            if ($testerSource -notmatch 'capabilityEngine\.mjs') { throw 'Tester is not wired to the clean capability engine.' }
            foreach ($requiredBrainText in @('api.groq.com/openai/v1/chat/completions','json_schema','capabilityIds()','ownerUsername','requestOwnerPermission','dispatchCapability','MAX_ACTIONS_PER_PLAN','handlePlayerMessage','EVENT_COALESCE_MS','RATE_LIMIT_FALLBACK_MS','max_completion_tokens','rate_limit_exceeded','rateLimitedUntil')) {
              if ($brainSource -notmatch [regex]::Escape($requiredBrainText)) { throw "Groq brain guard is missing: $requiredBrainText" }
            }
            foreach ($requiredPermissionText in @('function askOwner(requester, action, displayAction = action, execution = null)','pending.set(key, { id, requester, action, displayAction, execution','ownerUsername','owner-approved player cancellation')) {
              if ($runtimeSource -notmatch [regex]::Escape($requiredPermissionText)) { throw "Owner permission guard is missing: $requiredPermissionText" }
            }
            foreach ($requiredRuntimeText in @('GoalFollow','guardLocation','taskIsActive','assertTaskActive','runManualCapability','lastTaskResult','bot.stopDigging?.()','bot.collectBlock.movements = movements','bot.collectBlock?.cancelTask?.()','target_lost','target_not_found','bot.isSleeping === true','bot.wake')) {
              if ($runtimeSource -notmatch [regex]::Escape($requiredRuntimeText)) { throw "Runtime guard is missing: $requiredRuntimeText" }
            }
            foreach ($requiredTesterText in @('toVec3(bot,{x:0,y:1,z:0})','getLastTaskResult','STOPPED (CANCELLED)','TARGET_LOST','bot.openContainer(liveBlock)','const RUNTIME_EXECUTED','bot.__zoyaCapabilityRuntime = runtime','if(id==="op_command")','const weaponTypeScore','HOSTILES.has(name)','if(id==="check_equipment")','if(id==="ask_permission")','if(id==="remember_player")','if(id==="watch")','if(id==="coordinate_with_player")','if(id==="whisper_player" || id==="report_result" || id==="ask_clarification")')) {
              if ($testerSource -notmatch [regex]::Escape($requiredTesterText)) { throw "Verification guard is missing: $requiredTesterText" }
            }
            if ($runtimeSource -notmatch 'Damage observed; preserving active task ownership.') { throw 'Damage must not globally cancel active Minecraft tasks.' }
            Write-Host "Clean bridge static guards passed: $registeredCapabilities definitions / $logicalHandlerCount handlers + Groq owner-permission controller."
          } finally { Pop-Location }

      - name: Run deterministic PvP expert tests
        shell: pwsh
        run: |
          $bridgeDist = Join-Path $env:RUNNER_TEMP 'MinecraftBridge'
          Push-Location $bridgeDist
          try {
            node pvpExpertBrain.test.mjs
            if ($LASTEXITCODE -ne 0) { throw 'PvP Expert deterministic tests failed.' }
          } finally { Pop-Location }

      - name: Verify Mineflayer plugin imports
        shell: pwsh
        run: |
          $bridgeDist = Join-Path $env:RUNNER_TEMP 'MinecraftBridge'
          Push-Location $bridgeDist
          try {
            node --input-type=module -e "await import('mineflayer'); await import('mineflayer-pathfinder'); await import('mineflayer-tool'); await import('mineflayer-collectblock'); await import('mineflayer-crafting-util'); await import('./minecraftRuntime.mjs'); await import('./zoyaBrain.mjs'); await import('./capabilityModes.mjs'); await import('./capabilityEngine.mjs'); await import('./capabilityTester.mjs'); console.log('Minecraft bridge ESM/plugin smoke test passed.')"
            if ($LASTEXITCODE -ne 0) { throw 'Minecraft bridge ESM/plugin smoke test failed.' }
          } finally { Pop-Location }

      - name: Bundle Node runtime
        shell: pwsh
        run: |
          $bridgeDist = Join-Path $env:RUNNER_TEMP 'MinecraftBridge'
          $nodeVersion = '24.21.0'
          $nodeZip = Join-Path $env:RUNNER_TEMP "node-v$nodeVersion-win-x64.zip"
          $nodeExtract = Join-Path $env:RUNNER_TEMP 'NodeRuntime'
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-win-x64.zip" -OutFile $nodeZip
          if (Test-Path $nodeExtract) { Remove-Item $nodeExtract -Recurse -Force }
          Expand-Archive -Path $nodeZip -DestinationPath $nodeExtract -Force
          $nodeExe = Get-ChildItem -Path $nodeExtract -Filter 'node.exe' -File -Recurse | Select-Object -First 1
          if (-not $nodeExe) { throw 'node.exe was not found.' }
          Copy-Item -Path $nodeExe.FullName -Destination (Join-Path $bridgeDist 'node.exe') -Force

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build standalone MinecraftBridge.exe launcher
        shell: pwsh
        run: |
          $launcherRoot = Join-Path $PWD 'minecraft-bridge-launcher'
          $bridgeDist = Join-Path $env:RUNNER_TEMP 'MinecraftBridge'
          cargo build --manifest-path (Join-Path $launcherRoot 'Cargo.toml') --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Minecraft bridge launcher build failed.' }
          Copy-Item -Path (Join-Path $launcherRoot 'target/x86_64-pc-windows-msvc/release/minecraft-bridge-launcher.exe') -Destination (Join-Path $bridgeDist 'MinecraftBridge.exe') -Force

      - name: Verify final standalone bridge bundle
        shell: pwsh
        run: |
          $bridgeDist = Join-Path $env:RUNNER_TEMP 'MinecraftBridge'
          foreach ($required in @('MinecraftBridge.exe','node.exe','index.mjs','zoyaBrain.mjs','minecraftRuntime.mjs','capabilityEngine.mjs','capabilityTester.mjs','swordPvpBrain.mjs','swordPvpController.mjs','swordPvpController.test.mjs','swordPvpModel.json','package.json')) {
            if (-not (Test-Path (Join-Path $bridgeDist $required))) { throw "Final bridge bundle is missing: $required" }
          }
          if (-not (Test-Path (Join-Path $bridgeDist 'node_modules/mineflayer'))) { throw 'Mineflayer dependency is missing from final bridge bundle.' }
          Write-Host 'Standalone Minecraft bridge bundle verified.'

      - name: Create distributable ZIP
        shell: pwsh
        run: |
          $bridgeDist = Join-Path $env:RUNNER_TEMP 'MinecraftBridge'
          $zip = Join-Path $env:RUNNER_TEMP 'MinecraftBridge-Windows-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $bridgeDist '*') -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw 'Minecraft bridge ZIP was not created.' }

      - name: Upload Minecraft Bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftBridge-Windows-x64
          path: ${{ runner.temp }}/MinecraftBridge-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
