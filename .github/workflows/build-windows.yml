name: Build ZOYA Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: zoya-ai-companion-MAIN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build standalone C# companion engine
        run: dotnet publish src-tauri/companion-engine/ZOYA.CompanionEngine.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o src-tauri/companion-engine/bin

      - name: Download Mate Engine runtime
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'MateEngine.zip'
          $url = 'https://github.com/shinyflvre/Mate-Engine/releases/download/Public-Release-X3.3.0/Public.Release.X3.3.0-HOTFIX-1.zip'
          Write-Host "Downloading Mate Engine runtime..."
          Invoke-WebRequest -Uri $url -OutFile $zip
          $extract = Join-Path $env:RUNNER_TEMP 'MateEngine'
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $exe = Get-ChildItem -Path $extract -Filter 'MateEngineX.exe' -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'MateEngineX.exe was not found in the Mate Engine release archive.' }
          $dest = Join-Path $PWD 'src-tauri/mate-companion/bin'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path (Join-Path $exe.Directory.FullName '*') -Destination $dest -Recurse -Force
          Write-Host "Bundling Mate Engine from $($exe.Directory.FullName)"

      - name: Strip optional Mate model and local AI data
        shell: pwsh
        run: |
          $mateRoot = Join-Path $PWD 'src-tauri/mate-companion/bin'
          if (-not (Test-Path $mateRoot)) { throw "Mate runtime directory not found: $mateRoot" }

          # ZOYA supplies Carlotta.vrm separately and uses Groq for AI.
          # Keep Unity's runtime containers and native Windows dependencies intact.
          # In particular, DO NOT delete undreamai runtime DLL/LIB payloads: the
          # previous build removed them and Mate then failed to launch.
          $modelExtensions = @('.vrm', '.me', '.fbx', '.gltf', '.glb', '.pmx', '.pmd', '.obj', '.blend')
          $removed = @()

          Get-ChildItem -Path $mateRoot -Recurse -File | ForEach-Object {
            $extension = $_.Extension.ToLowerInvariant()
            if ($modelExtensions -contains $extension -or $extension -eq '.gguf') {
              $removed += $_.FullName
              Remove-Item -LiteralPath $_.FullName -Force
            }
          }

          if ($removed.Count -gt 0) {
            Write-Host "Removed optional Mate model/local-AI files: $($removed.Count)"
            $removed | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "No standalone Mate model/local-AI files needed removal."
          }

          $mateExe = Join-Path $mateRoot 'MateEngineX.exe'
          $mateData = Join-Path $mateRoot 'MateEngineX_Data'
          if (-not (Test-Path $mateExe)) { throw 'MateEngineX.exe is missing after payload pruning.' }
          if (-not (Test-Path $mateData)) { throw 'MateEngineX_Data is missing after payload pruning.' }

          $bytes = (Get-ChildItem -Path $mateRoot -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $gb = [math]::Round($bytes / 1GB, 2)
          Write-Host "Mate runtime size after safe pruning: $gb GB"

      - name: Prepare Carlotta VRM for Tauri resources
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'public/mint/Carlotta.vrm'
          $destination = Join-Path $PWD 'src-tauri/mate-companion/Carlotta.vrm'
          if (-not (Test-Path $source)) { throw "Carlotta.vrm not found at $source" }
          New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
          Copy-Item -Path $source -Destination $destination -Force
          Write-Host "Prepared Carlotta VRM at $destination"

      - name: Install dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri installer
        run: npx tauri build

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ZOYA-Windows-Installer
          path: zoya-ai-companion-MAIN/src-tauri/target/release/bundle/msi/*.msi
