name: Build ZOYA Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: zoya-ai-companion-MAIN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Repair Windows icon format
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'src-tauri/icons/128x128@2x.png'
          $target = 'src-tauri/icons/icon.ico'

          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            throw 'ImageMagick (magick) is required on the Windows runner to generate the ICO resource.'
          }

          magick $source -define icon:auto-resize=16,24,32,48,64,128 $target

          if (-not (Test-Path $target)) {
            throw 'Failed to generate src-tauri/icons/icon.ico.'
          }

      - name: Build Tauri installer
        run: npx tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ZOYA-Windows-Installer
          path: zoya-ai-companion-MAIN/src-tauri/target/release/bundle/nsis/*.exe
